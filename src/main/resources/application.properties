spring.application.name=rolebaseauth
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://host.docker.internal:5432/rolebaseauth}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
